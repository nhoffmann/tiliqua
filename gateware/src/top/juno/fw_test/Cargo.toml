# Host-side tests for juno firmware modules that don't touch the hardware
# (fw/ is pinned to the riscv target). Run: cargo test (in this directory).
[package]
name = "juno-fw-test"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
opts = { path = "../../../rs/opts" }
heapless = "0.9.3"
log = "0.4.17"
strum_macros = "0.28.0"
strum = { version = "0.28.0", features = ["derive"], default-features = false }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_derive = "1.0.219"
sequential-storage = { version = "8.0.2", default-features = false }
postcard = { version = "1.1.3", default-features = false }
embedded-storage = { version = "0.3.1", default-features = false }
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.6.0"
embassy-sync = "0.8.0"
