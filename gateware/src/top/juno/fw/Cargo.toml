[package]
name = "juno-fw"
version = "0.1.0"
edition = "2021"

[lib]
name = "tiliqua_fw"

[dependencies]
tiliqua-hal = { path="../../../rs/hal", default-features = false }
tiliqua-lib = { path = "../../../rs/lib" }
tiliqua-pac = { path="../pac", default-features = false, features = ["critical-section", "vexriscv"] }
opts = { path = "../../../rs/opts" }
static_cell = "2.1.1"
portable-atomic = { version = "1.15.0", default-features = false, features = ["critical-section"] }

log = "0.4.17"
embedded-hal = "=1.0.0"
riscv = { version = "=0.16.1", features = ["critical-section-single-hart"] }
riscv-rt = { version = "=0.18.0", features = ["single-hart"] }
micromath = "2.1.0"
fastrand = { version = "2.1.0", default-features = false }
heapless = "0.9.3"
strum_macros = "0.28.0"
strum = {version = "0.28.0", features = ["derive"], default-features=false}
fixed = "1.28.0"
trig-const = "0.4.0"
midi-types = "0.1.7"
midi-convert = "0.2.0"
critical-section = "1.2.0"
embassy-sync = "0.8.0"
# presets (preset.rs), same versions as the opts crate
sequential-storage = { version = "8.0.2", default-features = false }
postcard = { version = "1.1.3", default-features = false }
embedded-storage = { version = "0.3.1", default-features = false }
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.6.0"
amaranth-soc-isr = { path="../../../rs/isr", default-features = false }
irq = "0.2.3"
serde = { version="1.0.219", default-features=false }
serde_derive = "1.0.219"

[features]
# Simulation only: step through the menu pages (see sim_ui.py).
sim_pages = []

[profile.release]
codegen-units = 1
debug = true
debug-assertions = false
incremental = false
lto = true
opt-level = 2
overflow-checks = false
